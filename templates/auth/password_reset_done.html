{% extends 'base.html' %}
{% load static %}

{% block title %}Password Reset Sent — {{ APP_NAME }}{% endblock %}

{% block content %}
<div class="container py-5 my-4">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="glass-card p-4 p-md-5 shadow-lg text-center">
        <span class="d-inline-flex align-items-center justify-content-center bg-dark rounded-circle p-3 border border-success mb-3">
          <i class="bi bi-envelope-check-fill text-success fs-3"></i>
        </span>
        <h2 class="fw-bold mb-2">Check Your Email</h2>
        <p class="text-secondary small mb-4">
          If an account exists with the email you entered, we have sent instructions for resetting your password.
        </p>
        <a href="{% url 'login' %}" class="btn btn-outline-light rounded-pill px-4">
          <i class="bi bi-arrow-left me-1"></i> Return to Log In
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
