{% extends 'base.html' %}
{% load static %}

{% block title %}Forgot Password — {{ APP_NAME }}{% endblock %}

{% block content %}
<div class="container py-5 my-4">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="glass-card p-4 p-md-5 shadow-lg">
        <div class="text-center mb-4">
          <span class="d-inline-flex align-items-center justify-content-center bg-dark rounded-circle p-3 border border-info mb-3">
            <i class="bi bi-key-fill text-neon-blue fs-3"></i>
          </span>
          <h2 class="fw-bold mb-1">Reset Password</h2>
          <p class="text-secondary small">Enter your email address to receive password recovery instructions.</p>
        </div>

        <form method="POST" action="{% url 'forgot_password' %}">
          {% csrf_token %}
          <div class="mb-4">
            <label class="form-label small text-secondary fw-semibold">EMAIL ADDRESS</label>
            <input type="email" name="email" class="form-control bg-dark border-secondary text-light" placeholder="name@example.com" required>
          </div>

          <button type="submit" class="btn btn-neon-green w-100 py-3 fw-bold">
            <i class="bi bi-envelope-fill me-2"></i> Send Reset Link
          </button>
        </form>

        <div class="text-center mt-4 pt-3 border-top border-secondary">
          <a href="{% url 'login' %}" class="text-secondary small text-decoration-none">
            <i class="bi bi-arrow-left me-1"></i> Back to Log In
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
