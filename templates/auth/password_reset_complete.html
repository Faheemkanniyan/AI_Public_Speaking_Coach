{% extends 'base.html' %}
{% load static %}

{% block title %}Password Reset Complete — {{ APP_NAME }}{% endblock %}

{% block content %}
<div class="container py-5 my-4">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="glass-card p-4 p-md-5 shadow-lg text-center">
        <span class="d-inline-flex align-items-center justify-content-center bg-dark rounded-circle p-3 border border-success mb-3">
          <i class="bi bi-check-circle-fill text-success fs-3"></i>
        </span>
        <h2 class="fw-bold mb-2">Password Reset Successful</h2>
        <p class="text-secondary small mb-4">
          Your password has been reset successfully. You can now log in with your new credentials.
        </p>
        <a href="{% url 'login' %}" class="btn btn-neon-green rounded-pill px-4 py-2 fw-bold">
          Log In Now
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
